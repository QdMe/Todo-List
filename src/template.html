<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
  </head>
  <body>
    <nav class="side-bar">
      <h1 class="website-name">Todo List</h1>
      <div class="projects">
        <div class="heading">
          <h2 class="heading-title">My Projects</h2>
          <button class="add-project-btn">+</button>
        </div>
        <div id="projects-list">
          <!-- <div class="project"># Welcome 👋 <button>Del</button></div> -->
        </div>
      </div>
    </nav>
    <dialog id="add-project-dialog" closedby="any">
      <form>
        <div>
          <label for="project-title">Name</label>
          <input type="text" id="project-title" name="project-title" required />
        </div>
        <div class="submit-form">
          <!-- <button class="cancel-btn">Cancel</button> -->
          <button class="add-btn">Add</button>
        </div>
      </form>
    </dialog>
    <dialog id="create-todo" closedby="any">
      <form>
        <div class="title">
          <label for="todo-title">Title:</label>
          <input type="text" id="todo-title" name="todo-title" />
        </div>
        <div class="description">
          <label for="todo-desc">Description:</label>
          <input type="text" id="todo-desc" name="todo-desc" />
        </div>
        <div class="date-priority">
          <div class="date-div">
            <label for="date">Date:</label>
            <input type="date" id="date" name="date" />
          </div>
          <div class="priority-div">
            <select name="priority" id="priority">
              <option value="high">High</option>
              <option value="meduim" selected>Meduim</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="submit-form">
            <!-- <button class="cancel-btn">Cancel</button> -->
            <button class="add-btn">Add</button>
          </div>
        </div>
      </form>
    </dialog>

      <div class="todos">
