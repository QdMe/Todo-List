<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
  <script defer src="main.js"></script></head>
  <body>
    <nav class="side-bar">
      <h1 class="page-title">Todo List</h1>
        <div class="heading">
          <h2 class="heading-title">My Projects</h2>
          <button class="add-project-btn">+</button>
        </div>
        <div id="projects-list"></div>
      </div>
    </nav>
    <dialog id="add-project-dialog" closedby="any">
      <form>
        <h1 class="dialog-title" autofocus>Add project</h1>
        <div>
          <label for="project-title">Name</label>
          <input type="text" id="project-title" name="project-title" required />
        </div>
        <div class="submit-form">
          <button class="add-btn">Add</button>
        </div>
      </form>
    </dialog>
    <dialog id="create-todo" closedby="any">
      <div class="wrapper">
      <h1 class="dialog-title" autofocus>Add Todo</h1>
      <form>
        <div class="title">
          <label for="todo-title">Title</label>
          <input type="text" id="todo-title" name="todo-title" />
        </div>
        <div class="description">
          <label for="todo-desc">Description</label>
          <input type="text" id="todo-desc" name="todo-desc" />
        </div>
          <div class="date-div">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" />
          </div>
          <div class="priority-div">
            <label for="priority">Priority</label>
            <select name="priority" id="priority">
              <option value="High">High</option>
              <option value="Meduim" selected>Meduim</option>
              <option value="Low">Low</option>
            </select>
          </div>
          <div class="submit-form">
            <!-- <button class="cancel-btn">Cancel</button> -->
            <button class="add-btn">Add</button>
          </div>
        </div>
      </form>
      </div>
    </dialog>
    <!-- Edit todo dialog -->

    <dialog id="edit-todo" closedby="any">
      <div class="wrapper">
        
        <h1 class="dialog-title">Edit Todo</h1>
        <form>
          <div class="title">
            <label for="todo-title-edit">Title:</label>
            <input type="text" id="todo-title-edit" name="todo-title-edit" />
          </div>
          <div class="description">
            <label for="todo-desc">Description:</label>
            <input type="text" id="todo-desc-edit" name="todo-desc-edit" />
          </div>
          <div class="date-div">
            <label for="date-edit">Date:</label>
            <input type="date" id="date-edit" name="date" />
          </div>
          <div class="priority-div">
            <label for="priority">Priority: </label>
            <select name="priority" id="priority-edit">
              <option value="High">High</option>
              <option value="Meduim" selected>Meduim</option>
              <option value="Low">Low</option>
            </select>
          </div>
          <div class="submit-form">
            <!-- <button class="cancel-btn">Cancel</button> -->
            <button class="add-btn">Save</button>
          </div>
        </form>
      </div>
    </dialog>
    <div class="content">
      <div class="todos">
      </div>
    </div>
  </body>
</html>
